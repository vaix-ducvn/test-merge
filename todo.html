<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .app-header {
      background: #4f46e5;
      color: #fff;
      padding: 24px;
    }

    .app-header h1 { font-size: 1.5rem; font-weight: 700; }

    .stats {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .input-area input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus { border-color: #4f46e5; }

    .btn-add {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-add:hover { background: #4338ca; }

    .filters {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .filter-btn {
      flex: 1;
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      color: #6b7280;
    }

    .filter-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
      font-weight: 600;
    }

    .task-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .task-list:empty::after {
      content: "No tasks yet. Add one above!";
      display: block;
      text-align: center;
      color: #9ca3af;
      padding: 32px 16px;
      font-size: 0.9rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s;
    }

    .task-item:hover { background: #f9fafb; }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      color: #111827;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #d1d5db;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #ef4444; }

    .app-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
    }

    .footer-text { font-size: 0.8rem; color: #9ca3af; }

    .btn-clear {
      background: none;
      border: none;
      font-size: 0.8rem;
      color: #ef4444;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .btn-clear:hover { background: #fee2e2; }
    .btn-clear:disabled { opacity: 0.4; cursor: default; }
    .btn-clear:disabled:hover { background: none; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <div class="stats" id="stats">0 tasks</div>
    </header>

    <div class="input-area">
      <input
        type="text"
        id="task-input"
        placeholder="Add a new task..."
        maxlength="200"
        autocomplete="off"
      />
      <button class="btn-add" id="btn-add">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <footer class="app-footer">
      <span class="footer-text" id="footer-text"></span>
      <button class="btn-clear" id="btn-clear">Clear completed</button>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'todo-list-tasks';

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let filter = 'all';

    const taskInput = document.getElementById('task-input');
    const taskList  = document.getElementById('task-list');
    const btnAdd    = document.getElementById('btn-add');
    const btnClear  = document.getElementById('btn-clear');
    const statsEl   = document.getElementById('stats');
    const footerEl  = document.getElementById('footer-text');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text, done: false });
      taskInput.value = '';
      save();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function render() {
      const visible = tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done')   return t.done;
        return true;
      });

      taskList.innerHTML = '';
      visible.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = task.done;
        cb.addEventListener('change', () => toggleTask(task.id));

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const del = document.createElement('button');
        del.className = 'btn-delete';
        del.textContent = '✕';
        del.title = 'Delete task';
        del.addEventListener('click', () => deleteTask(task.id));

        li.append(cb, span, del);
        taskList.appendChild(li);
      });

      const total    = tasks.length;
      const done     = tasks.filter(t => t.done).length;
      const active   = total - done;

      statsEl.textContent = `${total} task${total !== 1 ? 's' : ''} · ${done} completed`;
      footerEl.textContent = `${active} item${active !== 1 ? 's' : ''} left`;
      btnClear.disabled = done === 0;
    }

    btnAdd.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    btnClear.addEventListener('click', clearCompleted);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    render();
  </script>
</body>
</html>
